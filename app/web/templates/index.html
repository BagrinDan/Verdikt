{% extends "base.html" %}

{% block title %}Scan{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', path='css/staper.css') }}">
{% endblock %}

{% block content %}
    <div class="container wide">
        <div class="panel">
            <h2> Git-Repository </h2>

            <form id="analyzeForm" action="/static_analyze/codeql" method="POST" class="form-row">
                <div class="field">
                    <label for="repo_url">Repository URL</label>
                    <input type="text" id="repo_url" name="repo_url" placeholder="https://github.com/user/repo.git">
                </div>

                <div class="field">
                    <label for="branch_name">Branch</label>
                    <input type="text" id="branch_name" name="branch" placeholder="main">
                </div>

                <div class="field">
                    <label for="language">Language</label>
                    <select id="language" name="language" required>
                        <option value="python" selected>Python</option>
                        <option value="java">Java</option>
                        <option value="c">C</option>
                        <option value="cpp">C++</option>
                        <option value="golang">Golang</option>
                    </select>
                </div>

                <button type="submit">Scan</button>
            </form>

            <div id="stepper-container" class="stepper-container">
                <div class="step" data-step="codeql">
                    <div class="step-circle"></div>
                    <div class="step-label">CodeQL</div>
                    <div class="step-sub">alerts</div>
                </div>
                <div class="step" data-step="salieri">
                    <div class="step-circle"></div>
                    <div class="step-label">LLM</div>
                    <div class="step-sub">verdicts</div>
                </div>
                <div class="step" data-step="amadeus">
                    <div class="step-circle"></div>
                    <div class="step-label">Verdict</div>
                    <div class="step-sub">advice</div>
                </div>
            </div>
        </div>
    </div>

    <div id="status-alert" class="status-message"></div>
{% endblock %}

{% block scripts %}
    <script src="/static/js/scan_api.js"></script>
{% endblock %}
